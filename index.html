<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>COLLEGE ADMISSION REGISTRATION FORM</h1>

    <form>
        <div> <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter full name" minlength="5" maxlength="20" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter Email">
        </div>

        <div>
            <label for="password">password</label>
            <input id="password" type="password" placeholder="Enter password" minlength="5" maxlength="20" required>
        </div>

        <div>
            <label for="mobile">Mobile number</label>
            <input id="mobile" type="tel" placeholder="Enter phone number"  pattern="[0-9]{10}"
       maxlength="10" required>
        </div>

        <div>
            <label for="dob">DOB</label>
            <input id="dob" type="date" name="DOB">
        </div>

        <input id="male" type="radio" name="gender" value="male">
        <label for="male">male</label>

        <input id="female" type="radio" name="gender" value="female">
        <label for="female">female</label>

        <input id="others" type="radio" name="gender" value="others">
        <label for="others">others</label>

        <div>
            <label for="courses">COURSES</label>
            <select id="courses" required>
                <option value="" disabled selected>SELECT courses</option>
                <option value="B.sc">B.sc</option>
                <option value="B.com">B.com</option>
                <option value="BBA">BBA</option>
                <option value="BCA">BCA</option>
            </select>
        </div>

        <input id="html" type="checkbox">
        <label for="html">html</label>

        <input id="css" type="checkbox">
        <label for="css">css</label>

        <input id="java script" type="checkbox">
        <label for="java script">java script</label>

        <input id="python" type="checkbox">
        <label for="python">python</label>

        <div>
            <label for="address">address</label>
            <textarea id="address" placeholder="Enter address" rows="5"></textarea>
        </div>

        <div>
            <label for="photo">upload photo:</label>
            <input id="photo" type="file" accept=".jpg ,.png ,.pdf,.jpeg" required>
        </div>
        <small>pic size betwenn 1mb-2mb</small>
        <div>
            <button type="submit">submit</button>
            <button type="reset">reset</button>
        </div>
    </form>
</body>

</html>
